<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — Graphic Design, Video & Motion</title>
  <meta name="description" content="Portfolio of a graphic designer, video editor and motion graphics designer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="nav">
    <a href="#top" class="logo" data-site="name">Your Name</a>
    <button class="nav-toggle" aria-label="Open menu" aria-expanded="false">☰</button>
    <nav class="nav-links">
      <a href="#work">Work</a>
      <a href="#services">Services</a>
      <a href="#about">About</a>
      <a href="#contact" class="btn btn-small">Hire me</a>
    </nav>
  </header>

  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <div class="hero-bg" aria-hidden="true">
        <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
      </div>
      <p class="eyebrow"><span class="dot"></span><span data-site="availability"></span></p>
      <h1>
        <span class="line">Design.</span>
        <span class="line">Edit.</span>
        <span class="line gradient-text">Motion.</span>
      </h1>
      <p class="hero-role" data-site="role"></p>
      <p class="hero-tagline" data-site="tagline"></p>
      <div class="hero-actions">
        <a href="#work" class="btn">View my work</a>
        <button class="btn btn-ghost" id="showreel-btn" hidden>▶ Watch showreel</button>
      </div>
    </section>

    <!-- WORK -->
    <section id="work" class="section">
      <div class="section-head">
        <h2>Selected work</h2>
        <div class="filters" role="tablist" aria-label="Filter projects">
          <button class="filter active" data-filter="all">All</button>
          <button class="filter" data-filter="graphic">Graphic Design</button>
          <button class="filter" data-filter="video">Video Editing</button>
          <button class="filter" data-filter="motion">Motion Graphics</button>
        </div>
      </div>
      <div class="grid" id="project-grid"></div>
    </section>

    <!-- SERVICES -->
    <section id="services" class="section">
      <h2>What I do</h2>
      <div class="services" id="services-list"></div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section about">
      <div>
        <h2>About me</h2>
        <div id="about-text"></div>
        <div class="stats" id="stats"></div>
      </div>
      <div>
        <h3>Tools I use</h3>
        <ul class="tools" id="tools"></ul>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section contact">
      <h2>Let's create something <span class="gradient-text">together</span>.</h2>
      <p>Have a project in mind? Tell me about it — I usually reply within 24 hours.</p>
      <a class="btn btn-big" id="email-link" href="#"></a>
      <ul class="socials" id="socials"></ul>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span data-site="name"></span> · <span data-site="location"></span></p>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">
    <div class="lb-inner">
      <button class="lb-close" aria-label="Close">✕</button>
      <div class="lb-media" id="lb-media"></div>
      <div class="lb-info">
        <span class="tag" id="lb-cat"></span>
        <h3 id="lb-title"></h3>
        <p id="lb-desc"></p>
        <p class="lb-meta" id="lb-meta"></p>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
